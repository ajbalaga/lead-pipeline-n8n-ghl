services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://leaduser:${POSTGRES_PASSWORD}@postgres:5432/leads
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    depends_on:
      - postgres
    expose:
      - "3000"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=leaduser
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=leads
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    expose:
      - "5432"

  # Pin this to a specific version once you have it running (check the tag on
  # Docker Hub) - n8n 3.0 (due Oct 2026) drops the legacy Function node and a
  # couple of env vars this compose file doesn't use, but it's worth pinning
  # so an unattended `docker compose pull` doesn't jump major versions on you.
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      - N8N_HOST=${N8N_DOMAIN}
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${N8N_DOMAIN}/
      - GENERIC_TIMEZONE=Asia/Manila
    volumes:
      - n8n_data:/home/node/.n8n
    expose:
      - "5678"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - APP_DOMAIN=${APP_DOMAIN}
      - N8N_DOMAIN=${N8N_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - n8n

volumes:
  pgdata:
  n8n_data:
  caddy_data:
  caddy_config:
